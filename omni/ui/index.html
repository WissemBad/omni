<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>omni — Catalogue</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#16181d;--panel:#1e2128;--line:#2c313b;--fg:#e4e7ee;--mut:#8b93a3;--acc:#5aa2ff;--ok:#4cc38a;--warn:#e6b450;--err:#ef6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f3f4f7;--panel:#fff;--line:#d9dde5;--fg:#1c2026;--mut:#667085;--acc:#2563eb}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;grid-template-rows:auto minmax(0,1fr) auto 130px;height:100%;gap:1px;background:var(--line)}
header{grid-column:1/3;background:var(--panel);display:flex;gap:16px;align-items:center;padding:8px 16px}
header b{font-size:15px}header .mut{color:var(--mut)}header .sp{flex:1}
#left{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#filters{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
input[type=search],select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mut)}
#list{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
.row{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.row:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}.row.sel{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.row .n{flex:1;min-width:0}.row .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .n div:last-child{color:var(--mut);font-size:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
#right{background:var(--bg);position:relative;min-height:0}
#view{position:absolute;inset:0}
#meta{position:absolute;left:12px;top:12px;background:#000a;color:#fff;padding:8px 12px;border-radius:8px;max-width:70%;font-size:12px}
#bar{grid-column:1/3;background:var(--panel);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
#log{grid-column:1/3;background:var(--panel);overflow:auto;padding:8px 16px;font:12px/1.5 ui-monospace,Consolas,monospace}
#bg{position:absolute;right:12px;top:12px;background:#000b;color:#fff;padding:10px 12px;border-radius:8px;display:none;gap:6px;grid-template-columns:auto 180px;align-items:center;font-size:12px;max-height:calc(100% - 24px);overflow:auto}
#bg select{padding:4px 6px;border-radius:6px;background:#1e2128;color:#fff;border:1px solid #444}#bg b{grid-column:1/3;font-size:12px;margin-top:4px}
.mode button.on{background:var(--acc);border-color:var(--acc);color:#fff}.pm-only{display:none}body.pm .pm-only{display:revert}body.pm .props-only{display:none}
.ok{color:var(--ok)}.PARTIAL{color:var(--warn)}.FAILED{color:var(--err)}
</style></head>
<body><div id="app">
<header><b>omni</b><span class="mut" id="src">…</span><span class="mode"><button id="mprops" class="on">Props</button> <button id="mpm">Personnages</button></span><span class="sp"></span><span class="mut" id="dep"></span><button id="bdep">Lier à GMod</button>
<select id="sfmt" title="auto : Vorbis du jeu en .ogg sans réencodage, autres codecs en .flac sans perte"><option value="auto">Sons : auto (ogg/flac)</option><option value="flac">Sons : FLAC</option><option value="wav">Sons : WAV</option><option value="mp3">Sons : MP3</option></select><button id="bsnd">Exporter les sons</button></header>
<section id="left">
  <div id="filters">
    <input type="search" id="q" placeholder="Rechercher (nom, hash)…" autofocus>
    <select id="cat" class="props-only"><option value="">Toutes les catégories</option></select>
    <div class="props-only" style="display:flex;gap:14px"><label class="chk"><input type="checkbox" id="skin" checked> inclure les skinnés (statues)</label><label class="chk"><input type="checkbox" id="named" checked> nommés seulement</label></div>
  </div>
  <div id="list"></div>
</section>
<section id="right"><div id="view"></div><div id="meta">Sélectionne un asset pour l'aperçu 3D.</div><div id="bg"></div></section>
<div id="bar">
  <span id="count" class="mut props-only">0 sélectionné</span>
  <label class="chk props-only"><input type="checkbox" id="phys" checked> collision</label>
  <label class="chk props-only" title="Option facultative : un .blend par modèle, matériaux déjà liés aux textures"><input type="checkbox" id="blend"> produire un .blend (matériaux liés)</label>
  <button id="go" class="pri props-only" disabled>Convertir la sélection</button><button id="clr" class="props-only">Vider</button>
  <span class="pm-only mut" id="fam">Aucun personnage sélectionné</span>
  <input class="pm-only" id="ptitle" placeholder="Nom dans GMod (facultatif)" style="padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:240px">
  <button id="gopm" class="pri pm-only" disabled>Créer le playermodel</button>
  <span id="prog" class="mut"></span>
</div>
<div id="log"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s), sel=new Set(); let rows=[], timer=null;
const log=(h,c='')=>{const d=document.createElement('div');d.className=c;d.textContent=h;$('#log').prepend(d)};
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()};
async function info(){const i=await api('/api/info');$('#src').textContent=i.title+' — '+i.assets+' assets';$('#dep').textContent=i.deployed?'lié à GMod ✓':'non lié';$('#bdep').textContent=i.deployed?'Délier':'Lier à GMod';$('#bdep').dataset.on=i.deployed?1:0;if(!i.assets)setTimeout(info,3000)}
$('#bdep').onclick=async()=>{try{const r=await api('/api/deploy?remove='+($('#bdep').dataset.on==='1'),{method:'POST'});log(r.message);info()}catch(e){log(e.message,'FAILED')}};
const cats=await api('/api/categories');for(const c of cats){const o=document.createElement('option');o.value=c.cat;o.textContent=`${c.cat} (${c.n})`;$('#cat').appendChild(o)}
async function search(){const p=new URLSearchParams({q:$('#q').value,cat_:$('#cat').value,named:$('#named').checked?1:0,limit:200});if(!$('#skin').checked)p.set('skinned',0);
 rows=await api('/api/search?'+p);const L=$('#list');L.innerHTML='';for(const r of rows){const d=document.createElement('div');d.className='row'+(sel.has(r.key)?' sel':'');
 d.innerHTML=`<input type="checkbox" ${sel.has(r.key)?'checked':''}><div class="n"><div></div><div></div></div>${r.skinned?'<span class="tag">statue</span>':''}`;
 d.querySelector('.n div').textContent=r.rel.split('/').pop();d.querySelector('.n div:last-child').textContent=r.rel;
 d.querySelector('input').onclick=e=>{e.stopPropagation();toggle(r.key,d)};d.onclick=()=>show(r,d);L.appendChild(d)}}
function toggle(k,d){sel.has(k)?sel.delete(k):sel.add(k);d.classList.toggle('sel',sel.has(k));d.querySelector('input').checked=sel.has(k);$('#count').textContent=sel.size+' sélectionné(s)';$('#go').disabled=!sel.size}
$('#clr').onclick=()=>{sel.clear();$('#count').textContent='0 sélectionné';$('#go').disabled=true;search()};
for(const id of ['#q','#cat','#skin','#named'])$(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,250)});
// ---- viewer
const R=new THREE.WebGLRenderer({antialias:true});$('#view').appendChild(R.domElement);const S=new THREE.Scene();S.background=new THREE.Color(0x2b2f37);
const C=new THREE.PerspectiveCamera(45,1,0.01,2000);S.add(new THREE.HemisphereLight(0xffffff,0x444455,1.6));const D=new THREE.DirectionalLight(0xffffff,2);D.position.set(3,5,4);S.add(D);S.add(new THREE.GridHelper(10,20,0x666666,0x444444));
const O=new OrbitControls(C,R.domElement);let cur=null;
function fit(){const w=$('#view').clientWidth||600,h=$('#view').clientHeight||400;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
(function a(){requestAnimationFrame(a);if(R.domElement.width!==($('#view').clientWidth||600))fit();O.update();R.render(S,C)})();
async function show(r,d){document.querySelectorAll('.row.sel').forEach(x=>{if(!sel.has(x.dataset.k))x.classList.remove('sel')});$('#meta').textContent='Chargement '+r.rel+' …';
 new GLTFLoader().load('/api/glb/'+r.key,g=>{if(cur)S.remove(cur);cur=g.scene;S.add(cur);const b=new THREE.Box3().setFromObject(cur),z=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(z.x,z.y,z.z)||1;
  C.position.set(c.x+m*1.2,c.y+m*.8,c.z+m*1.6);O.target.copy(c);O.update();$('#meta').innerHTML='';const t=document.createElement('div');t.textContent=r.rel+' — '+r.key+' — '+z.toArray().map(v=>(v*100).toFixed(0)).join(' × ')+' cm';$('#meta').appendChild(t)},undefined,e=>{$('#meta').textContent='Aperçu impossible : '+r.key})}
// ---- convert
$('#go').onclick=async()=>{const keys=[...sel];$('#go').disabled=true;try{const {job}=await api('/api/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys,physics:$('#phys').checked,blend:$('#blend').checked})});log('Job '+job+' : '+keys.length+' modèle(s)');poll(job,0)}catch(e){log(e.message,'FAILED');$('#go').disabled=false}};
async function poll(job,seen){const j=await api('/api/job/'+job);for(const r of j.results.slice(seen)){log(`${r.status.padEnd(7)} ${r.key} ${r.model||''} ${r.errors.join('; ')} (${r.seconds}s)`,r.status)}$('#prog').textContent=`${j.done}/${j.total} — ${j.phase}`;
 if(j.phase==='done'||j.phase==='error'){log(j.phase==='error'?j.error:'Terminé. '+JSON.stringify(j.stats||{}),j.phase==='error'?'FAILED':'ok');if(j.blends)log(j.blends.length+' fichier(s) .blend générés dans workspace/blend');$('#go').disabled=!sel.size;return}
 setTimeout(()=>poll(job,j.results.length),800)}
// ---- characters (game outfits): bodygroups, skins, presets
let mode='props', fam=null, meta=null, parser=null, mats={}, st={skin:0,groups:[]};
function setMode(m){mode=m;document.body.classList.toggle('pm',m==='pm');$('#mprops').classList.toggle('on',m==='props');$('#mpm').classList.toggle('on',m==='pm');
 $('#q').placeholder=m==='pm'?'Rechercher un personnage (ex. arrowhead, bond, guard)…':'Rechercher (nom, hash)…';$('#bg').style.display='none';search()}
$('#mprops').onclick=()=>setMode('props');$('#mpm').onclick=()=>setMode('pm');
async function searchPM(){const r=await api('/api/outfits?'+new URLSearchParams({q:$('#q').value,limit:400}));const L=$('#list');L.innerHTML='';
 for(const f of r){const d=document.createElement('div');d.className='row'+(fam===f.family?' sel':'');
  d.innerHTML=`<div class="n"><div></div><div></div></div><span class="tag"></span>`;
  d.querySelector('.n div').textContent=f.family.replace(/^outfit_/,'');d.querySelector('.n div:last-child').textContent=f.count+' variation(s)';
  d.querySelector('.tag').textContent=f.body||'?';d.onclick=()=>{document.querySelectorAll('.row.sel').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');showPM(f)};L.appendChild(d)}}
async function showPM(f){fam=f.family;$('#fam').textContent=fam;$('#gopm').disabled=true;$('#bg').style.display='none';
 $('#meta').textContent='Préparation de '+fam+' (matériaux, pose)… quelques secondes la première fois';
 try{meta=await api('/api/outfit/'+encodeURIComponent(fam)+'/preview')}catch(e){$('#meta').textContent='Aperçu impossible : '+e.message;return}
 new GLTFLoader().load('/api/outfit/'+encodeURIComponent(fam)+'/glb?t='+Date.now(),g=>{if(cur)S.remove(cur);cur=g.scene;S.add(cur);parser=g.parser;mats={};
  const b=new THREE.Box3().setFromObject(cur),z=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(z.x,z.y,z.z)||1;
  C.position.set(c.x+m*.5,c.y+m*.15,c.z+m*1.5);O.target.copy(c);O.update();
  $('#meta').textContent=`${fam} — ${meta.presets.length} variation(s), ${meta.groups.length} bodygroup(s), ${meta.skins} skin(s), LOD ${meta.lod}`;
  controls();applyPreset(0);$('#gopm').disabled=false},undefined,e=>{$('#meta').textContent='Aperçu impossible : '+fam})}
function sel_(label,opts,val,on){const l=document.createElement('span');l.textContent=label;const s=document.createElement('select');
 opts.forEach((o,i)=>{const x=document.createElement('option');x.value=i;x.textContent=o;s.appendChild(x)});s.value=val;s.onchange=()=>on(+s.value);$('#bg').append(l,s);return s}
function controls(){const B=$('#bg');B.innerHTML='';B.style.display='grid';
 sel_('Préréglage',meta.presets.map(p=>'v'+p.variant+' — '+p.name.replace(/^outfit_/,'')),0,applyPreset).id='bgpre';
 sel_('Skin',[...Array(meta.skins).keys()].map(i=>'skin '+i),0,v=>{st.skin=v;apply()}).id='bgskin';
 const t=document.createElement('b');t.textContent='Bodygroups';B.appendChild(t);
 meta.groups.forEach((g,gi)=>{sel_(g.name,g.options,0,v=>{st.groups[gi]=v;apply()}).id='bgg'+gi})}
function applyPreset(i){const p=meta.presets[i];st.skin=p.skin;st.groups=meta.groups.map(g=>p.bodygroups[g.name]??0);
 $('#bgskin').value=st.skin;meta.groups.forEach((g,gi)=>{$('#bgg'+gi).value=st.groups[gi]});apply()}
function material(i){if(!(i in mats))mats[i]=parser.getDependency('material',i);return mats[i]}
function apply(){if(!cur)return;const sk=meta.skin_materials[st.skin]||{};
 cur.traverse(o=>{if(!o.isMesh)return;const [tag,col]=o.name.split('|');const m=/^g(\d+)o(\d+)$/.exec(tag);
  o.visible=tag==='base'||(m&&st.groups[+m[1]]===+m[2]);const mi=sk[col];if(mi!==undefined&&o.visible)material(mi).then(x=>{o.material=x})})}
$('#gopm').onclick=async()=>{if(!fam)return;$('#gopm').disabled=true;try{const {job}=await api('/api/outfit/'+encodeURIComponent(fam)+'/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#ptitle').value})});
 log('Playermodel '+fam+' : compilation…');poll(job,0)}catch(e){log(e.message,'FAILED')}finally{setTimeout(()=>{$('#gopm').disabled=false},1500)}};
const _search=search;search=async()=>mode==='pm'?searchPM():_search();
// ---- sounds export
$('#bsnd').onclick=async()=>{$('#bsnd').disabled=true;try{const {job}=await api('/api/sounds?format='+$('#sfmt').value,{method:'POST'});log('Export des sons ('+$('#sfmt').value+') lancé');pollSnd(job,0)}catch(e){log(e.message,'FAILED');$('#bsnd').disabled=false}};
async function pollSnd(job,seen){const j=await api('/api/job/'+job);for(const m of j.log.slice(seen))log(m);$('#prog').textContent=j.log.length?j.log[j.log.length-1]:'';
 if(j.phase==='done'||j.phase==='error'){log(j.phase==='error'?j.error:'Sons exportés : '+JSON.stringify(j.summary),j.phase==='error'?'FAILED':'ok');$('#bsnd').disabled=false;return}
 setTimeout(()=>pollSnd(job,j.log.length),1500)}
info();search();
</script></body></html>
