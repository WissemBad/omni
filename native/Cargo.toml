[package]
name = "omni_native"
version = "1.0.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Native core of omni: textures (decode, mips, DXT, VTF, PNG), audio (Wwise -> Ogg/FLAC/WAV), game collision, skinning"

[lib]
name = "omni_native"
crate-type = ["cdylib", "rlib"]
doctest = false          # the vendored ww2ogg examples name the upstream crate

[features]
default = ["python", "parallel"]
python = ["dep:pyo3", "dep:numpy", "parallel"]
parallel = ["dep:rayon", "texpresso/rayon"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312", "generate-import-lib"], optional = true }
numpy = { version = "0.29", optional = true }
rayon = { version = "1.10", optional = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
texture2ddecoder = "0.1"
texpresso = { version = "2" }
lewton = "0.10"
sha1_smol = "1"
miniz_oxide = "0.9"
aes = "0.9"
jpeg-encoder = { version = "0.7", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[lints.rust]
unused = "warn"

# CI runs clippy with -D warnings. The lints below are style suggestions (as_chunks, is_multiple_of, ...) or
# deliberate choices (`!(w > x)` treats NaN as "not greater"): correctness lints are not on this list.
[lints.clippy]
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
needless_range_loop = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
items_after_test_module = "allow"
collapsible_if = "allow"
map_entry = "allow"
manual_c_str_literals = "allow"
unnecessary_sort_by = "allow"
