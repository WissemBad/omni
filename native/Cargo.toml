[package]
name = "omni_native"
version = "1.0.4"
edition = "2021"
description = "Native core of omni: textures (decode, mips, DXT, VTF, PNG), audio (Wwise -> Ogg/FLAC/WAV), game collision, skinning"

[lib]
name = "omni_native"
crate-type = ["cdylib", "rlib"]
doctest = false          # the vendored ww2ogg examples name the upstream crate

[features]
default = ["python", "parallel"]
python = ["dep:pyo3", "dep:numpy", "parallel"]
parallel = ["dep:rayon", "texpresso/rayon"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312", "generate-import-lib"], optional = true }
numpy = { version = "0.29", optional = true }
rayon = { version = "1.10", optional = true }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode"] }
texture2ddecoder = "0.1"
texpresso = { version = "2" }
lewton = "0.10"
sha1_smol = "1"
miniz_oxide = "0.9"
aes = "0.9"
jpeg-encoder = { version = "0.7", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
