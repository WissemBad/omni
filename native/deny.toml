# cargo deny check  (CI: .woodpecker/check.yml)
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste is unmaintained and only a build-time macro of texture2ddecoder; tracked in the finalisation plan (native-deps)
  { id = "RUSTSEC-2024-0436", reason = "proc-macro dependency of texture2ddecoder, no runtime code" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "0BSD", "IJG"]
unused-allowed-license = "allow"
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
