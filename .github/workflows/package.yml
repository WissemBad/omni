name: Package

# Builds the Windows application and starts it, on the pull requests that can break it: a packaging mistake used to
# surface only when a release tag was pushed.
on:
  pull_request:
    paths:
      - packaging/**
      - omni/app.py
      - omni/cli.py
      - omni/tray.py
      - pyproject.toml
      - uv.lock
      - scripts/smoke_package.py
      - .github/workflows/package.yml
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Web interface
        shell: pwsh
        run: |
          Set-Content -Path "$HOME/.npmrc" -Value "//npm.pkg.github.com/:_authToken=$env:TOKEN" -Encoding ascii
          bun install --frozen-lockfile
          bun run build
        working-directory: web
        env:
          TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Python environment
        run: uv sync --locked

      - name: Rust core
        run: |
          uvx maturin build --release -m native/Cargo.toml -o wheels
          uv pip install --find-links wheels omni_native
          uv run --no-sync python -m omni native --build --wasm

      - name: Application
        run: uv run --no-sync pyinstaller packaging/omni.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Smoke test
        run: uv run --no-sync python scripts/smoke_package.py

      - name: Installer compiles
        shell: pwsh
        run: iscc "/DAppVersion=0.0.0" packaging\omni.iss
