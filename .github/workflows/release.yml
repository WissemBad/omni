name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "pyproject.toml says $v, the tag is ${{ github.ref_name }}" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: oven-sh/setup-bun@v2

      - name: Web interface
        shell: pwsh
        run: |
          Set-Content -Path "$HOME/.npmrc" -Value "//npm.pkg.github.com/:_authToken=$env:TOKEN" -Encoding ascii
          bun install --frozen-lockfile
          bun run build
        working-directory: web
        env:
          TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Python environment
        run: uv sync --locked

      - name: Rust core
        run: |
          uvx maturin build --release -m native/Cargo.toml -o wheels
          uv pip install --find-links wheels omni_native
          uv run --no-sync python -m omni native --build --wasm

      - name: Tests
        run: uv run --no-sync pytest -q

      - name: Application
        run: uv run --no-sync pyinstaller packaging/omni.spec --noconfirm --distpath dist --workpath build/pyi

      - name: Installer and archive
        shell: pwsh
        run: |
          iscc "/DAppVersion=$env:VERSION" packaging\omni.iss
          Compress-Archive -Path dist\Omni\* -DestinationPath "dist\Omni-$env:VERSION-windows.zip"
          Get-ChildItem dist\Omni-*.exe, dist\Omni-*.zip | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii

      - name: Release notes
        run: uv run --no-sync python scripts/release_notes.py "$env:VERSION" > notes.md

      - name: Publish
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist\Omni-Setup-$env:VERSION.exe dist\Omni-$env:VERSION-windows.zip dist\SHA256SUMS.txt --title "omni ${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
