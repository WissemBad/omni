name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: omni version
      description: Home page footer or `Omni.exe --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Job logs (Home, Jobs panel) help.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and Garry's Mod
      placeholder: Windows 11 24H2, GMod x86-64 branch
