version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: cron
      cronjob: 10 7 21 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - '*'
      uv-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: cron
      cronjob: 20 7 21 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - '*'
      cargo-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: cron
      cronjob: 30 7 21 * *
      timezone: Europe/Paris
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      bun-security:
        applies-to: security-updates
        patterns:
          - '*'
      bun-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
