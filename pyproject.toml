[project]
name = "omni"
version = "1.0.3"
description = "Converts the assets of a game into Garry's Mod content and glTF"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "Pillow",
  "fastapi",
  "uvicorn",
  "scipy>=1.18.1",
  "coacd>=1.0.14",
  "vpk>=1.4.0",
  "py7zr>=0.22",
  "pywebview>=5.3",
  "pystray>=0.19.5",
]

[dependency-groups]
dev = [
    "lz4",                     # tests/rpkg_builder.py writes LZ4-compressed test packages
    "pygltflib",               # tests read the .glb files the Rust writer produces
    "pyinstaller>=6.10",
    "ruff>=0.6",
    "httpx2>=2.13.1",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["web", "native", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E501",    # long lines are fine in tables and docstrings
  "E701", "E702", "E731",
  "B008", "B905", "B007", "B017", "B904", "B018", "B019", "B023", "E741",
  "UP007", "UP037", "UP045",
  "W291", "W293",
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402", "F401", "B018", "E741"]
"tests/*" = ["E402", "E741"]
